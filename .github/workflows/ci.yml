name: CI

on:
  push:
    branches: [main, dev_opencode]
  pull_request:
    branches: [main, dev_opencode]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install --upgrade pip && pip install ".[test]"
      - name: Validate config
        run: python -m daily_brief config validate
      - name: Run tests
        run: python -m pytest tests/ -q -m "not smoke"

  build:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build
        run: pip install build
      - name: Build package
        run: python -m build
      - name: List wheel contents
        run: |
          ls dist/daily_brief-*.whl
          python -c "
          import glob, zipfile
          for whl in glob.glob('dist/daily_brief-*.whl'):
              print(f'Wheel: {whl}')
              zipfile.ZipFile(whl).printdir()
              break
          "

  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: pip install --upgrade pip && pip install ".[test]" ruff mypy
      - name: Check format
        run: ruff format --check daily_brief/ tests/
      - name: Lint (report only)
        run: ruff check --output-format=github daily_brief/ tests/ || true
      - name: Type check (report only)
        run: mypy daily_brief/ || true
