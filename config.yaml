    max_stories: 5
    min_age_hours: 24
  "Weather Forecast 77316":
    query: ""
    max_stories: 0
    min_age_hours: 8
  "Houston Tropical Weather":
    query: "Houston Tropical Weather"
    max_stories: 1
    min_age_hours: 24
  "Market News":
    query: "market news"
    max_stories: 5
    min_age_hours: 24
  "Semiconductors":
    query: "semiconductors"
    max_stories: 5
    min_age_hours: 24
  "Big Tech":
