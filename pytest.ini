[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not smoke"
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks integration tests
    smoke: marks smoke tests that require network (run with -m smoke)
filterwarnings =
    error::RuntimeWarning:daily_brief
    error::DeprecationWarning:daily_brief
